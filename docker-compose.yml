version: '3.8'

services:
  web:
    build: .
    container_name: django_app
    restart: always
    ports:
      - "8000:8000"
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      - DJANGO_DEBUG=1
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    dns:
      - 8.8.8.8
      - 8.8.4.4